# Nginx Configuration for POS Toko Akbar Media Group
# Domain: pos.akbarmediagroup.me (Port 4750) & toko.akbarmediagroup.me (Port 4760)
# Location on Ubuntu: /etc/nginx/sites-available/pos.akbarmediagroup.me

# 1. Backend REST API Server (Port 4750)
server {
    listen 4750;
    listen [::]:4750;
    server_name pos.akbarmediagroup.me 127.0.0.1 localhost;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript;

    client_max_body_size 10M;

    access_log /var/log/nginx/pos_api_access.log;
    error_log /var/log/nginx/pos_api_error.log warn;

    location / {
        proxy_pass http://127.0.0.1:4750;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

